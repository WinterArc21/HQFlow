name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

# Keep this filename stable: npm Trusted Publishing identifies this workflow
# when exchanging GitHub's OIDC token for publish access.
permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-codehq
  cancel-in-progress: false

jobs:
  release:
    name: Validate, publish, and release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Read the release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Inspect release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          published=false
          tagged=false
          released=false

          if npm view "hqflow@$VERSION" version >/dev/null 2>&1; then
            published=true
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            tagged=true
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            released=true
          fi

          needed=true
          if [ "$published" = "true" ] && [ "$tagged" = "true" ] && [ "$released" = "true" ]; then
            needed=false
            echo "v$VERSION is already fully released; nothing to do."
          fi

          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Validate an existing partial-release tag
        if: steps.state.outputs.needed == 'true' && steps.state.outputs.tagged == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          tagged_commit=$(git rev-list -n 1 "v$VERSION")
          if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
            echo "v$VERSION points to $tagged_commit, not this main commit ($GITHUB_SHA)."
            exit 1
          fi

      - name: Install dependencies
        if: steps.state.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        if: steps.state.outputs.needed == 'true'
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run build
          pnpm run test:ci
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e

      - name: Publish to npm
        if: steps.state.outputs.needed == 'true' && steps.state.outputs.published != 'true'
        run: npm publish

      - name: Create and push tag
        if: steps.state.outputs.needed == 'true' && steps.state.outputs.tagged != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Create GitHub Release
        if: steps.state.outputs.needed == 'true' && steps.state.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
